<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Phone</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Roboto', sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Dialer Screen */
    #dialer-screen {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      padding-bottom: 30px;
    }
    .display-area {
      flex-grow: 1;
      display: flex;
       flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 20px;
      position: relative;
    }
    #phone-number {
      font-size: 38px;
      letter-spacing: 2px;
      min-height: 50px;
      text-align: center;
      word-break: break-all;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px 25px;
      padding: 20px 35px;
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
    }
    .key {
      background: #1f1f1f;
      border: none;
      border-radius: 50%;
      aspect-ratio: 1;
      color: #fff;
      font-size: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .key:active {
      background: #3a3a3a;
    }
    .key span {
      font-size: 10px;
      color: #9e9e9e;
      letter-spacing: 1.5px;
      margin-top: 2px;
    }
    .action-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      padding: 15px 35px;
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
    }
    .call-btn {
      grid-column: 2;
      background-color: #2e7d32;
      border: none;
      border-radius: 50%;
      width: 68px;
      height: 68px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .call-btn:active {
      background-color: #388e3c;
    }
    .backspace-btn {
      grid-column: 3;
      background: none;
      border: none;
      color: #9e9e9e;
      font-size: 24px;
      cursor: pointer;
      height: 50px;
    }

    /* In-Call Screen */
    #call-screen {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      padding: 60px 20px 50px;
      background: linear-gradient(180deg, #0f2027, #203a43, #121212);
    }
    .call-info {
      text-align: center;
    }
    #call-status {
      font-size: 16px;
      color: #a5d6a7;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    #calling-number {
      font-size: 34px;
      font-weight: 400;
      margin-bottom: 8px;
    }
    #sim-badge {
      font-size: 13px;
      color: #bdbdbd;
      background: rgba(255,255,255,0.1);
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-block;
    }
    .call-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 40px;
    }
    .control-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #e0e0e0;
      font-size: 12px;
      gap: 8px;
    }
    .control-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
    }
    .end-call-btn {
      background-color: #d32f2f;
      border: none;
      border-radius: 50%;
      width: 68px;
      height: 68px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    svg {
      fill: white;
      width: 28px;
      height: 28px;
    }
  </style>
</head>
<body>

  <!-- DIALER VIEW -->
  <div id="dialer-screen">
    <div class="display-area">
      <div id="phone-number"></div>
    </div>

    <div class="keypad">
      <button class="key" onclick="pressKey('1')">1<span> </span></button>
      <button class="key" onclick="pressKey('2')">2<span>ABC</span></button>
      <button class="key" onclick="pressKey('3')">3<span>DEF</span></button>
      <button class="key" onclick="pressKey('4')">4<span>GHI</span></button>
      <button class="key" onclick="pressKey('5')">5<span>JKL</span></button>
      <button class="key" onclick="pressKey('6')">6<span>MNO</span></button>
      <button class="key" onclick="pressKey('7')">7<span>PQRS</span></button>
      <button class="key" onclick="pressKey('8')">8<span>TUV</span></button>
      <button class="key" onclick="pressKey('9')">9<span>WXYZ</span></button>
      <button class="key" onclick="pressKey('*')">*</button>
      <button class="key" onclick="pressKey('0')">0<span>+</span></button>
      <button class="key" onclick="pressKey('#')">#</button>
    </div>

    <div class="action-row">
      <button class="call-btn" onclick="startFakeCall()" aria-label="Call">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
      </button>
      <button class="backspace-btn" onclick="backspace()" aria-label="Backspace">⌫</button>
    </div>
  </div>

  <!-- CALLING VIEW -->
  <div id="call-screen">
    <div class="call-info">
      <div id="call-status">Calling...</div>
      <div id="calling-number"></div>
      <div id="sim-badge">SIM 1 - Jio 5G</div>
    </div>

    <div class="call-controls">
      <div class="control-item"><div class="control-circle">🔇</div>Mute</div>
      <div class="control-item"><div class="control-circle">☷</div>Keypad</div>
      <div class="control-item" onclick="toggleSpeaker()"><div class="control-circle" id="spk-btn">🔊</div>Speaker</div>
    </div>

    <button class="end-call-btn" onclick="endFakeCall()" aria-label="End Call">
      <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
    </button>
  </div>

  <script>
    let currentNumber = "";
    let audioCtx = null;
    let callTimeouts = [];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playBeep(freq = 440, duration = 0.08) {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.value = 0.1;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function pressKey(digit) {
      if (currentNumber.length < 15) {
        currentNumber += digit;
        document.getElementById("phone-number").innerText = currentNumber;
        playBeep(600, 0.05);
      }
    }

    function backspace() {
      currentNumber = currentNumber.slice(0, -1);
      document.getElementById("phone-number").innerText = currentNumber;
    }

    function playRingbackTone() {
      initAudio();
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.frequency.value = 400;
      osc2.frequency.value = 450;
      gain.gain.value = 0.15;
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);
      osc1.start();
      osc2.start();
      osc1.stop(audioCtx.currentTime + 1.2);
      osc2.stop(audioCtx.currentTime + 1.2);
    }

    function speakOperatorMessage() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(
          "The number you have dialed is currently busy, or out of network coverage area. Please try again later."
        );
        msg.lang = "en-IN";
        msg.rate = 0.95;
        msg.onend = () => {
          document.getElementById("call-status").innerText = "Call Ended";
          document.getElementById("call-status").style.color = "#ef5350";
          playBeep(480, 0.3);
          callTimeouts.push(setTimeout(endFakeCall, 1200));
        };
        window.speechSynthesis.speak(msg);
      } else {
        endFakeCall();
      }
    }

    function startFakeCall() {
      if (currentNumber.length === 0) return;

      // Block USSD codes silently by showing "Invalid MMI Code"
      if (currentNumber.startsWith("*") || currentNumber.endsWith("#")) {
        alert("Connection problem or invalid MMI code.");
        currentNumber = "";
        document.getElementById("phone-number").innerText = "";
        return;
      }

      document.getElementById("dialer-screen").style.display = "none";
      document.getElementById("call-screen").style.display = "flex";
      document.getElementById("calling-number").innerText = currentNumber;
      document.getElementById("call-status").innerText = "Calling...";
      document.getElementById("call-status").style.color = "#a5d6a7";

      // Sequence: 1.5s silence -> Ring 1 -> 3s -> Busy/Unreachable Operator Voice
      callTimeouts.push(setTimeout(() => {
        document.getElementById("call-status").innerText = "Ringing...";
        playRingbackTone();
      }, 1500));

      callTimeouts.push(setTimeout(() => {
        document.getElementById("call-status").innerText = "Line Busy";
        document.getElementById("call-status").style.color = "#ffb74d";
        speakOperatorMessage();
      }, 4000));
    }

    function endFakeCall() {
      callTimeouts.forEach(t => clearTimeout(t));
      callTimeouts = [];
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      document.getElementById("call-screen").style.display = "none";
      document.getElementById("dialer-screen").style.display = "flex";
      currentNumber = "";
      document.getElementById("phone-number").innerText = "";
    }

    function toggleSpeaker() {
      const btn = document.getElementById("spk-btn");
      btn.style.background = btn.style.background ? "" : "rgba(255,255,255,0.4)";
    }
  </script>
</body>
</html>
